<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Accounts</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 56px;
      text-align: center;
    }

    .carousel-wrapper {
      position: relative;
      width: 100vw;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: absolute;
      width: 250px;
      height: 360px;
      border-radius: 28px;
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow:
        0 32px 64px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.35);
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 30px 24px;
      text-align: center;
      will-change: transform;
      touch-action: none;
    }

    .card.active {
      box-shadow:
        0 32px 64px rgba(0,0,0,0.5),
        0 0 40px rgba(255,255,255,0.18),
        inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .card:active { cursor: grabbing; }

    .card .badge {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 1rem;
      opacity: 0.85;
    }

    .card .icon {
      width: 74px;
      height: 74px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      margin-bottom: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .card p {
      font-size: 0.83rem;
      opacity: 0.6;
      font-weight: 300;
    }

    .card:nth-child(1) .icon { background: linear-gradient(135deg,#4facfe,#00f2fe); }
    .card:nth-child(2) .icon { background: linear-gradient(135deg,#43e97b,#38f9d7); }
    .card:nth-child(3) .icon { background: linear-gradient(135deg,#f093fb,#f5576c); }
    .card:nth-child(4) .icon { background: linear-gradient(135deg,#fda085,#f6d365); }
    .card:nth-child(5) .icon { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }

    .dots {
      display: flex;
      gap: 8px;
      margin-top: 36px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      transition: background 0.3s, transform 0.3s;
    }

    .dot.active {
      background: white;
      transform: scale(1.35);
    }

    .hint {
      margin-top: 20px;
      font-size: 0.75rem;
      opacity: 0.35;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .card {
        width: 220px;
        height: 330px;
      }
    }
  
.nav-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border:none;border-radius:50%;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.22);
  color:#fff;font-size:28px;cursor:pointer;
  transition:.25s;z-index:999;
}
.nav-btn:hover{background:rgba(255,255,255,.22);transform:translateY(-50%) scale(1.08);}
.prev{left:35px;}
.next{right:35px;}
@media(max-width:600px){
.nav-btn{width:44px;height:44px;font-size:22px;}
.prev{left:12px;}
.next{right:12px;}
}
</style>
</head>
<body>

<h1>Select Drive Account</h1>

<div class="carousel-wrapper" id="carousel">

  <div class="card" data-index="0">
    <div class="icon">☁️</div>
    <h2>ESKA</h2>
    <p>A luh theih e</p>
  </div>

  <div class="card" data-index="1">
    <div class="icon">👨‍👩‍👧</div>
    <h2>FAMILY.1</h2>
    <p>A luh theih e</p>
  </div>

  <div class="card" data-index="2">
    <div class="icon">🏠</div>
    <h2>FAMILY.2</h2>
    <p>A luh theih e</p>
  </div>

  <div class="card" data-index="3">
    <div class="icon">🔐</div>
    <span class="badge">🔒</span>
    <h2>OTHERS</h2>
    <p>Password angai</p>
  </div>

  <div class="card" data-index="4">
    <div class="icon">📱</div>
    <h2>SSA Phone ami</h2>
    <p>A luh theih e</p>
  </div>


  <button class="nav-btn prev">&#10094;</button>
  <button class="nav-btn next">&#10095;</button>

</div>

<div class="dots" id="dots"></div>
<p class="hint">Swipe or use arrow keys · Tap to open</p>

<script>
  const cards = Array.from(document.querySelectorAll('.card'));
  const dotsEl = document.getElementById('dots');
  const total = cards.length;

  let current = 0;
  let startX = 0;
  let isDragging = false;
  let dragDelta = 0;

  cards.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(d);
  });

  function getX(i) {
    const spacing = window.innerWidth < 600 ? 145 : 195;
    return (i - current) * spacing;
  }

  function getAngle(i) {
    return Math.max(-42, Math.min(42, (i - current) * 16));
  }

  function getScale(i) {
    const d = Math.abs(i - current);
    return d === 0 ? 1 : d === 1 ? 0.82 : d === 2 ? 0.66 : 0.52;
  }

  function getZ(i) {
    return 100 - Math.abs(i - current) * 20;
  }

  function getOpacity(i) {
    const d = Math.abs(i - current);
    return d === 0 ? 1 : d === 1 ? 0.72 : d === 2 ? 0.48 : 0.22;
  }

  function applyLayout(animated = true) {
    cards.forEach((card, i) => {
      card.style.transition = animated
        ? 'transform 0.42s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.42s ease'
        : 'none';

      card.style.zIndex = getZ(i);
      card.style.opacity = getOpacity(i);
      card.style.transform = `translateX(${getX(i)}px) rotate(${getAngle(i)}deg) scale(${getScale(i)})`;
      card.classList.toggle('active', i === current);
    });

    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === current);
    });
  }

  function goTo(index) {
    if (index < 0) current = total - 1;
    else if (index >= total) current = 0;
    else current = index;

    applyLayout(true);
  }

  applyLayout(false);

  function onStart(clientX) {
    isDragging = true;
    startX = clientX;
    dragDelta = 0;
  }

  function onMove(clientX) {
    if (!isDragging) return;

    dragDelta = clientX - startX;

    cards.forEach((card, i) => {
      card.style.transition = 'none';
      card.style.transform = `translateX(${getX(i) + dragDelta}px) rotate(${getAngle(i)}deg) scale(${getScale(i)})`;
    });
  }

  function onEnd(clientX) {
    if (!isDragging) return;

    isDragging = false;
    dragDelta = clientX - startX;

    if (dragDelta < -50) {
      goTo(current + 1);
    } else if (dragDelta > 50) {
      goTo(current - 1);
    } else {
      applyLayout(true);
    }
  }

  document.addEventListener('mousedown', e => {
    if (e.target.closest('.card')) onStart(e.clientX);
  });

  document.addEventListener('mousemove', e => onMove(e.clientX));
  document.addEventListener('mouseup', e => onEnd(e.clientX));

  document.addEventListener('touchstart', e => {
    if (e.target.closest('.card')) onStart(e.touches[0].clientX);
  }, { passive: true });

  document.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });

  document.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientX));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });

  document.querySelector('.prev').addEventListener('click', () => goTo(current - 1));
  document.querySelector('.next').addEventListener('click', () => goTo(current + 1));
</script>
</body>
</html>
